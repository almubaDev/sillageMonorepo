# Render Blueprint para Sillage
# Este archivo configura automáticamente todos los servicios necesarios

services:
  # Backend API (FastAPI)
  - type: web
    name: sillage-backend
    env: python
    region: oregon
    plan: free
    rootDir: sillage-backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Entorno
      - key: ENVIRONMENT
        value: production

      # Base de datos (automáticas desde Render)
      - key: DATABASE_URL
        fromDatabase:
          name: sillage-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: sillage-redis
          property: connectionString

      # Seguridad
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

      # APIs externas - CONFIGURAR MANUALMENTE
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Flow (pagos Chile) - CONFIGURAR MANUALMENTE
      - key: FLOW_API_KEY
        sync: false
      - key: FLOW_SECRET_KEY
        sync: false
      - key: FLOW_API_URL
        value: https://www.flow.cl/api
      - key: FLOW_SANDBOX
        value: False

      # Server
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000

      # CORS - CONFIGURAR MANUALMENTE
      - key: ALLOWED_ORIGINS
        sync: false

      # Email - CONFIGURAR MANUALMENTE
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # PayPal - CONFIGURAR MANUALMENTE
      - key: PAYPAL_BUSINESS_EMAIL
        sync: false
      - key: PAYPAL_MODE
        value: production

      # Backend URL - ACTUALIZAR DESPUÉS DEL DEPLOY
      - key: BACKEND_URL
        sync: false

databases:
  # PostgreSQL Database
  - name: sillage-db
    databaseName: sillage
    plan: free  # 1GB free tier

  # Redis Cache
  - name: sillage-redis
    plan: free  # 25MB free tier
