# Render Blueprint para Sillage
# Este archivo configura automáticamente todos los servicios necesarios

services:
  # Backend API (FastAPI)
  - type: web
    name: sillage-backend
    env: python
    region: oregon
    plan: free
    rootDir: sillage-backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python load_perfumes_from_csv.py perfumes_db2.csv && python create_superuser_auto.py contacto@forgeapp.cl "Anada!312$" Admin Sillage && python scripts/init_payment_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Base de datos PostgreSQL (automática desde Render)
      - key: DATABASE_URL
        fromDatabase:
          name: sillage-db
          property: connectionString

      # Redis - TEMPORAL: Cambiarlo después por Upstash o Render Redis
      - key: REDIS_URL
        value: redis://localhost:6379

      # Seguridad
      - key: SECRET_KEY
        generateValue: true

      # APIs externas
      - key: OPENWEATHER_API_KEY
        value: f3df07cd491790df460045d5478882fc
      - key: GEMINI_API_KEY
        value: AIzaSyDk7p-t_bEj1tR77sLamZBr9-dS4GqzHHs
      - key: GOOGLE_MAPS_API_KEY
        value: AIzaSyBYW7kK_nRl4IHm8P5_MPqPDVPbMl7J-n0

      # Flow (pagos Chile)
      - key: FLOW_API_KEY
        value: 23F00F2E-779B-4C7B-9AD0-64E551L7C9FC
      - key: FLOW_SECRET_KEY
        value: b15579cf8b18bf709eb98b692845112a357208ac
      - key: FLOW_API_URL
        value: https://www.flow.cl/api

      # CORS
      - key: ALLOWED_ORIGINS
        value: https://sillage.pro,https://www.sillage.pro,https://api.sillage.pro,http://localhost:19006,http://localhost:8081

      # Email
      - key: EMAIL_HOST_USER
        value: info@consultorabadillo.com
      - key: EMAIL_HOST_PASSWORD
        value: iullxaejutmczvrf
      - key: DEFAULT_FROM_EMAIL
        value: info@consultorabadillo.com

